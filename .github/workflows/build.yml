name: DroidShim CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-core:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build SPM Core
        run: swift build --target DroidShimCore

      - name: Run Unit Tests
        run: swift test

      - name: List Xcode Schemes
        run: xcodebuild -list

      - name: Build iOS Framework (Device)
        run: |
          SCHEMES="$(xcodebuild -list)"
          if echo "$SCHEMES" | grep -q '^[[:space:]]*DroidShimCore$'; then
            IOS_SCHEME="DroidShimCore"
          elif echo "$SCHEMES" | grep -q '^[[:space:]]*DroidShimApp$'; then
            IOS_SCHEME="DroidShimApp"
          else
            IOS_SCHEME="DroidShim-Package"
          fi
          xcodebuild -scheme "$IOS_SCHEME" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO

      - name: Build iOS Framework (Simulator)
        run: |
          SCHEMES="$(xcodebuild -list)"
          if echo "$SCHEMES" | grep -q '^[[:space:]]*DroidShimCore$'; then
            IOS_SCHEME="DroidShimCore"
          elif echo "$SCHEMES" | grep -q '^[[:space:]]*DroidShimApp$'; then
            IOS_SCHEME="DroidShimApp"
          else
            IOS_SCHEME="DroidShim-Package"
          fi
          DESTINATIONS="$(xcodebuild -showdestinations -scheme "$IOS_SCHEME")"
          AVAILABLE_DESTINATIONS="$(printf '%s\n' "$DESTINATIONS" | awk '/Ineligible destinations/{exit} {print}')"
          if ! printf '%s\n' "$AVAILABLE_DESTINATIONS" | grep -q '{ platform:iOS Simulator'; then
            echo "No iOS Simulator destination is installed for $IOS_SCHEME; skipping simulator build."
            exit 0
          fi
          xcodebuild -scheme "$IOS_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS App
        run: |
          xcodebuild -project DroidShim.xcodeproj \
            -scheme DroidShimApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build-app \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO

      - name: Package Sideload IPA (unsigned)
        run: |
          if [ ! -d build-app/Build/Products/Release-iphoneos/DroidShimApp.app ]; then
            echo "DroidShimApp.app was not produced; skipping IPA packaging."
            exit 0
          fi
          mkdir -p Payload
          cp -R build-app/Build/Products/Release-iphoneos/DroidShimApp.app Payload/
          zip -qry DroidShim-sideload-unsigned.ipa Payload
          rm -rf Payload

      - name: Verify IPA Structure
        run: |
          test -f DroidShim-sideload-unsigned.ipa
          unzip -q DroidShim-sideload-unsigned.ipa -d ipa-check
          test -d ipa-check/Payload/DroidShimApp.app
          test -f ipa-check/Payload/DroidShimApp.app/DroidShimApp
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ipa-check/Payload/DroidShimApp.app/Info.plist
          find ipa-check/Payload/DroidShimApp.app -maxdepth 2 -type f | sort

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DroidShim-build
          if-no-files-found: warn
          path: |
            build/Build/Products/**/*.framework
            build/Build/Products/**/*.dylib
            build-app/Build/Products/**/*.app
            DroidShim-sideload-unsigned.ipa

      - name: Tag Release
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "v0.1.0-$(date +%s)"
          git push origin --tags
