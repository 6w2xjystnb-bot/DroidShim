name: DroidShim CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-core:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build SPM Core
        run: swift build --target DroidShimCore

      - name: Run Unit Tests
        run: swift test

      - name: List Xcode Schemes
        run: xcodebuild -list

      - name: Build iOS Framework (Device)
        run: |
          CORE_SCHEME="$(xcodebuild -list | awk '/Schemes:/{flag=1;next} flag && NF {print $1}' | grep -E '^(DroidShimCore|DroidShim-Package|DroidShim)$' | head -n 1)"
          test -n "$CORE_SCHEME"
          xcodebuild -scheme "$CORE_SCHEME" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO

      - name: Build iOS Framework (Simulator)
        run: |
          CORE_SCHEME="$(xcodebuild -list | awk '/Schemes:/{flag=1;next} flag && NF {print $1}' | grep -E '^(DroidShimCore|DroidShim-Package|DroidShim)$' | head -n 1)"
          test -n "$CORE_SCHEME"
          xcodebuild -scheme "$CORE_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./build \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Build iOS App
        run: |
          APP_SCHEME="$(xcodebuild -list | awk '/Schemes:/{flag=1;next} flag && NF {print $1}' | grep -E '^(DroidShimApp|DroidShim-Package|DroidShim)$' | head -n 1)"
          test -n "$APP_SCHEME"
          xcodebuild -scheme "$APP_SCHEME" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/DroidShimApp.app Payload/
          zip -r DroidShim.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DroidShim-build
          path: |
            build/Build/Products/**/*.framework
            DroidShim.ipa

      - name: Tag Release
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "v0.1.0-$(date +%s)"
          git push origin --tags
