name: DroidShim CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-core:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build SPM Core
        run: swift build --target DroidShimCore

      - name: Run Unit Tests
        run: swift test

      - name: List Xcode Schemes
        run: xcodebuild -list

      - name: Build iOS Framework (Device)
        run: |
          SCHEMES="$(xcodebuild -list)"
          if echo "$SCHEMES" | grep -q '^[[:space:]]*DroidShimCore$'; then
            IOS_SCHEME="DroidShimCore"
          elif echo "$SCHEMES" | grep -q '^[[:space:]]*DroidShimApp$'; then
            IOS_SCHEME="DroidShimApp"
          else
            IOS_SCHEME="DroidShim-Package"
          fi
          xcodebuild -scheme "$IOS_SCHEME" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO

      - name: Build iOS Framework (Simulator)
        run: |
          SCHEMES="$(xcodebuild -list)"
          if echo "$SCHEMES" | grep -q '^[[:space:]]*DroidShimCore$'; then
            IOS_SCHEME="DroidShimCore"
          elif echo "$SCHEMES" | grep -q '^[[:space:]]*DroidShimApp$'; then
            IOS_SCHEME="DroidShimApp"
          else
            IOS_SCHEME="DroidShim-Package"
          fi
          if ! xcodebuild -showdestinations -scheme "$IOS_SCHEME" | grep -q '{ platform:iOS Simulator'; then
            echo "No iOS Simulator destination is installed for $IOS_SCHEME; skipping simulator build."
            exit 0
          fi
          xcodebuild -scheme "$IOS_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS App
        run: |
          SCHEMES="$(xcodebuild -list)"
          if echo "$SCHEMES" | grep -q '^[[:space:]]*DroidShimApp$'; then
            APP_SCHEME="DroidShimApp"
          else
            APP_SCHEME="DroidShim-Package"
          fi
          if ! xcodebuild -showdestinations -scheme "$APP_SCHEME" | grep -q '{ platform:iOS,'; then
            echo "$APP_SCHEME has no installable iOS app destination in this SwiftPM package; skipping app build."
            exit 0
          fi
          xcodebuild -scheme "$APP_SCHEME" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (unsigned)
        run: |
          if [ ! -d build/Build/Products/Debug-iphoneos/DroidShimApp.app ]; then
            echo "DroidShimApp.app was not produced; skipping IPA packaging."
            exit 0
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/DroidShimApp.app Payload/
          zip -r DroidShim.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DroidShim-build
          path: |
            build/Build/Products/**/*.framework
            build/Build/Products/**/*.dylib
            DroidShim.ipa

      - name: Tag Release
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "v0.1.0-$(date +%s)"
          git push origin --tags
